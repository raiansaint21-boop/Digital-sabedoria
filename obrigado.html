<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Gerado | Digital black Ebook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="success-wrap">
    <section class="success-card">
      <h1>Pedido confirmado</h1>
      <p id="success-intro">Os dados do pedido foram gerados com sucesso.</p>

      <div class="success-grid">
        <article class="success-box">
          <h3>Resumo</h3>
          <p><strong>Pedido:</strong> <span id="order-id">-</span></p>
          <p><strong>Nome:</strong> <span id="order-name">-</span></p>
          <p><strong>Pagamento:</strong> <span id="order-method">-</span></p>
          <p><strong>Valor:</strong> <span id="order-amount">-</span></p>
        </article>
        <article class="success-box">
          <h3>Codigo para pagamento</h3>
          <p id="instruction">-</p>
          <p class="code" id="payment-code">-</p>
          <img id="pix-qr" class="pix-qr" alt="QR Code Pix" hidden>
          <button id="copy-code" class="btn btn-primary copy-btn" type="button">Copiar codigo</button>
          <p id="copy-feedback" class="form-message" aria-live="polite"></p>
        </article>
      </div>

      <p>
        Qualquer duvida, suporte em <strong>suporte@metodo7dias.com</strong>.
      </p>
      <a class="btn btn-primary" href="index.html">Voltar para a oferta</a>
    </section>
  </main>

  <script>
    (function () {
      var orderRaw = localStorage.getItem("lowticket_last_order");
      var intro = document.getElementById("success-intro");
      var copyButton = document.getElementById("copy-code");
      var copyFeedback = document.getElementById("copy-feedback");
      var pixQr = document.getElementById("pix-qr");

      if (!orderRaw) {
        intro.textContent = "Nenhum pedido recente foi encontrado. Gere um pagamento na pagina principal.";
        document.getElementById("instruction").textContent = "Acesse a oferta e finalize o formulario para continuar.";
        copyButton.disabled = true;
        return;
      }

      var order = JSON.parse(orderRaw);
      document.getElementById("order-id").textContent = order.id || "-";
      document.getElementById("order-name").textContent = order.buyerName || "-";
      document.getElementById("order-method").textContent = order.method || "-";
      document.getElementById("order-amount").textContent = order.amount || "-";
      document.getElementById("instruction").textContent = order.instruction || "-";
      document.getElementById("payment-code").textContent = order.code || "-";

      if (order.method === "Pix" && order.pixQrUrl) {
        pixQr.src = order.pixQrUrl;
        pixQr.hidden = false;
      }

      copyButton.addEventListener("click", async function () {
        try {
          await navigator.clipboard.writeText(order.code || "");
          copyFeedback.textContent = "Codigo copiado.";
          copyFeedback.className = "form-message success";
        } catch (error) {
          copyFeedback.textContent = "Nao foi possivel copiar automaticamente. Copie manualmente.";
          copyFeedback.className = "form-message error";
        }
      });
    })();
  </script>
</body>
</html>
